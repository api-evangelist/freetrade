contract_discovery:
  performed: '2026-08-04'
  result: no-public-machine-readable-api-contract
  summary: >-
    Full STEP 0b contract discovery was run against every Freetrade host, including
    the internal hosts named in the web platform's Content-Security-Policy. No
    OpenAPI, Swagger, AsyncAPI or MCP contract exists on any Freetrade surface, and
    Freetrade operates no developer portal. A real GraphQL endpoint DOES exist at
    https://core-service-gateway.freetrade.io/graphql — it is the private gateway the
    web trading platform calls — but it returns
    {"errors":[{"message":"introspection has been disabled","extensions":{"code":"INTROSPECTION_DISABLED"}}]}
    to an anonymous introspection query, publishes no SDL, no documentation, no
    onboarding and no terms permitting third-party use. It is therefore recorded as
    evidence, NOT wired as a GraphQL API pointer: it is an internal implementation
    detail of Freetrade's own client, not a product offered to developers. No schema
    is captured and none is inferred. Third-party "Freetrade API" packages on
    npm/GitHub (FinKi wrappers, community Python packages) are unofficial and are not
    recorded as Freetrade artifacts.
