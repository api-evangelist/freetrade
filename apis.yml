aid: freetrade
name: Freetrade
description: 'Freetrade is a UK retail investment platform, founded in 2018 and headquartered
  in London, that offers commission-free investing in more than 8,600 stocks, ETFs,
  investment trusts, mutual funds, gilts and UK Treasury bills across four account
  types — a stocks and shares ISA, a Junior ISA, a self-invested personal pension
  (SIPP) and a general investment account — on three subscription plans (Basic at
  £0/month, Standard and Plus). It operates a mobile app and a web platform at web.freetrade.io,
  serves over 1.6 million users, and is authorised and regulated by the Financial
  Conduct Authority (firm reference number 783189) as a member firm of the London
  Stock Exchange. Freetrade Limited (company number 09797821) was acquired by IG Group
  Holdings plc in April 2025 for £160m and continues to operate as an independently
  branded business. Freetrade publishes no public developer API, developer portal,
  OpenAPI/AsyncAPI/MCP contract or client SDK — a private GraphQL gateway backs its
  own web platform but has introspection disabled and no published schema or terms
  for third-party use — so its machine-readable public surface is a hand-curated
  llms.txt at freetrade.io/llms.txt plus an Intercom-hosted help-centre llms.txt.'
